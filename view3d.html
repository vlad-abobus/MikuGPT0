<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panda 3D Viewer</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0a0a;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    #webgl {
      width: 100%;
      height: 100%;
      display: block;
    }

    #info {
      position: absolute;
      top: 10px;
      left: 10px;
      padding: 6px 10px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.45);
      color: #e7e7e7;
      font-size: 12px;
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      pointer-events: none;
      user-select: none;
      transition: opacity 0.25s ease;
    }

    #info.hidden {
      opacity: 0;
    }

    #loader {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #f5f5f5;
      gap: 14px;
      background: radial-gradient(ellipse at center,
          rgba(20, 20, 24, 0.92) 0%,
          rgba(6, 6, 8, 0.98) 100%);
      transition: opacity 0.3s ease, visibility 0.3s ease;
      z-index: 10;
    }

    #loader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.18);
      border-top-color: #7fe8d8;
      animation: spin 0.9s linear infinite;
      box-shadow: 0 0 0 4px rgba(127, 232, 216, 0.08);
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .title {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      text-shadow: 0 6px 40px rgba(0, 0, 0, 0.45);
    }

    .hint {
      font-size: 11px;
      color: rgba(245, 245, 245, 0.64);
      max-width: 320px;
      text-align: center;
      line-height: 1.6;
      padding: 0 16px;
    }
  </style>
</head>

<body>
  <canvas id="webgl"></canvas>
  <div id="info"></div>
  <div id="loader">
    <div class="spinner"></div>
    <div class="title">Загрузка 3D-модели панды...</div>
      <div class="hint">

      <code>mdels/panda.glb</code>). �?�?��?���Ő��: <b>Idle</b>, <b>Talk</b>,
      <b>Yell</b> (��>�� <b>Yelling</b>). ���� �? <code>mdels/</code> ���� ��'�� FBX — ���?�?�?�?�?�?��>�� �? GLB.
    </div>
  </div>

  <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.161.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.161.0/examples/jsm/"
        }
      }
    </script>
  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

    const canvas = document.getElementById("webgl");
    const infoEl = document.getElementById("info");
    const loaderEl = document.getElementById("loader");

    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      alpha: false,
    }); 
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.useLegacyLights = false;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050505);

    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    pmremGenerator.compileEquirectangularShader();
    const envTexture = pmremGenerator.fromScene(
      new RoomEnvironment(renderer)
    ).texture;
    scene.environment = envTexture;
    scene.backgroundBlurriness = 0.08;

    const camera = new THREE.PerspectiveCamera(
      40,
      window.innerWidth / window.innerHeight,
      0.08,
      120
    );
    camera.position.set(0.0, 0.9, 2.4);

    const controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.target.set(0, 0.6, 0);
    controls.minDistance = 1.2;
    controls.maxDistance = 3.2;
    controls.autoRotate = false;
    controls.enablePan = false;

    const hemiLight = new THREE.HemisphereLight(0xf2f7ff, 0x0b0b0f, 2.2);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.4);
    dirLight.position.set(2.4, 3.2, 2.6);
    dirLight.castShadow = true;
    dirLight.shadow.bias = -0.00008;
    dirLight.shadow.mapSize.set(2048, 2048);
    scene.add(dirLight);

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(10, 10),
      new THREE.ShadowMaterial({ opacity: 0.18 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    const clock = new THREE.Clock();

    const mixer = new THREE.AnimationMixer(scene);
    let actions = {};
    let currentAction = null;
    let modelRoot = null;
    let speaking = false;
    let thinking = false;
    let speakingTimer = null;

    const actionNames = new Set();

    function showInfo(text) {
      if (!text) {
        infoEl.classList.add("hidden");
        return;
      }
      infoEl.textContent = text;
      infoEl.classList.remove("hidden");
    }

    function setLoaderVisible(visible) {
      if (visible) {
        loaderEl.classList.remove("hidden");
      } else {
        loaderEl.classList.add("hidden");
      }
    }

    function getActionNameCandidates(names) {
      const map = {
        idle: ["Idle", "idle", "Idle_001", "Idle_Loop", "Base_Idle"],
        talk: ["Talk", "talk", "Talking", "Talk_001", "Speak", "Speech"],
        yell: [
          "Yell",
          "yell",
          "Yelling",
          "Yell_001",
          "Shout",
          "Scream",
          "Angry_Talk",
        ],
      };
      const out = { idle: null, talk: null, yell: null };
      for (const key of Object.keys(map)) {
        for (const cand of map[key]) {
          if (names.includes(cand)) {
            out[key] = cand;
            break;
          }
        }
      }
      return out;
    }

    function fadeToAction(name, fadeTime = 0.25) {
      if (!name) return null;
      const next = actions[name];
      if (!next) return currentAction;
      if (currentAction === next) return next;
      if (currentAction) {
        currentAction.fadeOut(fadeTime);
      }
      next.reset().fadeIn(fadeTime).play();
      currentAction = next;
      return next;
    }

    function setState(state) {
      switch (state) {
        case "thinking":
          thinking = true;
          speaking = false;
          if (speakingTimer) {
            clearTimeout(speakingTimer);
            speakingTimer = null;
          }
          fadeToAction("idle", 0.2);
          showInfo("Думает...");
          break;
        case "speaking":
          thinking = false;
          speaking = true;
          if (speakingTimer) {
            clearTimeout(speakingTimer);
            speakingTimer = null;
          }
          const speakAnim = Math.random() < 0.5 ? "talk" : "yell";
          fadeToAction(speakAnim, 0.18);
          showInfo("Говорит");
          break;
        case "speaking_end":
        case "idle":
        default:
          thinking = false;
          speaking = false;
          if (speakingTimer) {
            clearTimeout(speakingTimer);
            speakingTimer = null;
          }
          fadeToAction("idle", 0.25);
          showInfo("");
          break;
      }
    }

    function startSpeaking(durationMs = 1800) {
      setState("speaking");
      if (speakingTimer) clearTimeout(speakingTimer);
      speakingTimer = setTimeout(() => {
        speakingTimer = null;
        if (speaking) {
          setState("idle");
        }
      }, Math.max(600, durationMs));
    }

    async function loadModel() {
      const loader = new GLTFLoader();
      const candidates = [
        "models/panda.glb",
        "mdels/panda.glb",
        "models/panda.gltf",
        "mdels/panda.gltf",
      "mdels/panda.glb",
      "mdels/Panda.glb",
      "models/panda.glb",
      "mdels/Panda.gltf",
      "mdels/panda.gltf",
      "models/panda.gltf",
    ];

      let gltf = null;
      let lastError = null;

      for (const url of candidates) {
        try {
          gltf = await new Promise((resolve, reject) => {
            loader.load(url, resolve, undefined, reject);
          });
          break;
        } catch (err) {
          lastError = err;
        }
      }

      if (!gltf) {
        console.warn(
          "Не удалось загрузить 3D-панду. Положите GLB в models/panda.glb",
          lastError
        );
        setLoaderVisible(false);
        showInfo("Модель панды не найдена (models/panda.glb)");
        return;
      }

      modelRoot = gltf.scene;
      modelRoot.traverse((obj) => {
        if (obj.isMesh) {
          obj.castShadow = true;
          obj.receiveShadow = true;
          obj.frustumCulled = false;
        }
      });

      modelRoot.scale.set(0.9, 0.9, 0.9);
      modelRoot.position.set(0, 0, 0);
      scene.add(modelRoot);

      const clips = gltf.animations || [];
      mixer.stopAllAction();
      actions = {};

      const clipNames = clips.map((c) => c.name);
      const candMap = getActionNameCandidates(clipNames);

      for (const clip of clips) {
        const action = mixer.clipAction(clip);
        action.setLoop(THREE.LoopRepeat);
        action.clampWhenFinished = false;
        actions[clip.name] = action;
        actionNames.add(clip.name);
      }

      const idleName = candMap.idle || clipNames.find((n) => /idle/i.test(n));
      const talkName = candMap.talk || clipNames.find((n) => /talk/i.test(n));
      const yellName = candMap.yell || clipNames.find((n) => /yell|shout|scream/i.test(n));

      if (idleName && actions[idleName]) actions["idle"] = actions[idleName];
      if (talkName && actions[talkName]) actions["talk"] = actions[talkName];
      if (yellName && actions[yellName]) actions["yell"] = actions[yellName];

      if (!actions["idle"] && Object.keys(actions).length > 0) {
        actions["idle"] = actions[Object.keys(actions)[0]];
      }

      setLoaderVisible(false);
      setState("idle");
      showInfo("");
    }

    window.addEventListener("resize", () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    });

    function animate() {
      const dt = clock.getDelta();
      mixer.update(dt);
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    animate();
    loadModel();

    window.setPandaState = (state) => {
      try {
        setState(state);
      } catch (e) {
        console.warn(e);
      }
    };

    window.pandaSpeak = (durationMs) => {
      try {
        const d = durationMs ? parseInt(durationMs) : 1800;
        startSpeaking(isNaN(d) ? 1800 : d);
      } catch (e) {
        startSpeaking(1800);
      }
    };

    window.pandaStop = () => {
      try {
        setState("idle");
      } catch (e) {
        console.warn(e);
      }
    };

    if (window.pywebview && window.pywebview.api) {
      window.addEventListener("pywebviewready", () => {
        console.log("pywebview ready");
      });
    }
  </script>
</body>

</html>
